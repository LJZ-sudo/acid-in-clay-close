# 数据集注册表（冻结配置）— WP0 / P0-2
# ---------------------------------------------------------------------------
# 单一真相源：澄清"15 个数据集 / 13 个出现转变"的口径，供手稿、图、E-Mem 共用,
# 杜绝审稿人"13 还是 15?"的计数质疑(GPT-3 §2 指出的风险)。
#
# 全部数值由 _new_data_analysis/regularity/build_regularity.py 对真实 stage0 产物
# (aggregated_results.json + arrhenius_analysis.json)实跑提取,**未人工编造**。
# 复跑：python _new_data_analysis/regularity/build_regularity.py
#
# 转变判据(与 build_regularity 一致,非事后挑选)：
#   has_transition = (seg0_npts >= 4) AND (seg1_npts >= 4)
#   即高温段与低温段各至少 4 个 Arrhenius 点,才算"真实两段转变";
#   单点尾段(pwlf 在最冷点的常见伪影)不计入 Ea。
dataset_registry_version: "dataset-registry-v1.0.0"
created: "2026-06-23"
frozen: true
generated_by: "_new_data_analysis/regularity/build_regularity.py"

summary:
  total_datasets: 15
  with_transition: 13          # 7 LRS + 4 starch + 2 line-B ATP
  without_transition: 2        # 2 CHITO(负类/边界,seg1 仅 2 点、Ea_low 4.6–5.3 eV 荒谬)
  qc_excluded: 0               # 无数据集被 QC 排除;CHITO 保留但标 has_transition=false
  positive_count_phrasing: "13/15"   # 论文统一措辞:15 个数据集中 13 个出现传导区间转变
  honest_note: >
    "13/15" 不是计数错误:15 = 13 条 line-A(7 LRS + 4 starch + 2 CHITO)+ 2 条 line-B
    凹凸棒土前瞻点;其中 13 个出现真实两段转变(LRS×7 + starch×4 + line-B×2),
    2 个 CHITO 为负类/边界(无干净低温段)。CHITO 计入总数但不计入"出现转变"。

